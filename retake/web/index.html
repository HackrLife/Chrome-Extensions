<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Retake · Free screen recorder in your browser</title>
    <meta name="description" content="Record your screen, retake a fluffed line without starting over, add callouts and export MP4, WebM, GIF or a vertical cut. Free, and nothing leaves your computer." />
    <link rel="icon" href="icons/icon-32.png" />
    <link rel="stylesheet" href="core/tokens.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header class="appbar">
      <a class="brand" href="./"><span id="logo"></span><span>Retake</span></a>
      <nav class="nav">
        <a class="chip" href="pages/library.html" id="libLink"></a>
        <a class="chip" href="https://github.com/HackrLife/chrome-extensions/tree/main/retake" target="_blank" rel="noopener" id="extLink"></a>
      </nav>
    </header>
    <main class="home">
      <section class="hero">
        <h1>Record, fix, polish and export.</h1>
        <p class="lead">A free screen recorder that runs in your browser. Fluffed a line? Retake just that part and carry on. Nothing you record leaves this computer.</p>
        <div class="flow" id="flow"></div>
      </section>
      <section class="panel recorder" id="recorder" aria-live="polite"></section>
    </main>
    <footer class="foot">
      <span>Free. No account, no upload, no watermark.</span>
      <a href="https://github.com/HackrLife/chrome-extensions/blob/main/retake/docs/privacy.md" target="_blank" rel="noopener">Privacy</a>
      <a href="https://github.com/HackrLife/chrome-extensions/issues" target="_blank" rel="noopener">Report a problem</a>
    </footer>
    <script type="module" src="app.js"></script>
  </body>
</html>
