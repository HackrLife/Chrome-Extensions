<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fernleaf · Onboarding checklist</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f6f7fb;color:#14161c}
header{display:flex;align-items:center;gap:14px;padding:18px 40px;background:#fff;border-bottom:1px solid #e6e8ee}.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#16a34a,#0ea5e9)}
header b{font-size:18px}main{padding:38px 40px;max-width:980px;margin:0 auto}h1{font-size:30px;margin:0 0 6px}.sub{color:#5b616e;margin:0 0 26px}
.step{display:flex;gap:16px;align-items:flex-start;background:#fff;border:1px solid #e6e8ee;border-radius:14px;padding:18px 20px;margin-bottom:12px}
.n{width:30px;height:30px;border-radius:50%;background:#e8edff;color:#2f54eb;font-weight:700;display:grid;place-items:center;flex:none}.done .n{background:#16a34a;color:#fff}
.step b{display:block;margin-bottom:3px}.step span{color:#5b616e;font-size:14px}</style></head><body>
<header><span class="logo"></span><b>Fernleaf</b></header>
<main><h1>Onboarding checklist</h1><p class="sub">Three steps to your first report</p>
<div class="step done"><div class="n">✓</div><div><b>Connect your data</b><span>Link a spreadsheet or your CRM in a couple of clicks.</span></div></div>
<div class="step"><div class="n">2</div><div><b>Pick a template</b><span>Choose from the gallery, or start from a blank report.</span></div></div>
<div class="step"><div class="n">3</div><div><b>Invite your team</b><span>Share the report and set who can edit it.</span></div></div>
</main></body></html>
