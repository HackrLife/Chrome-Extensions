<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Retake camera</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  .ring { position: absolute; inset: 4px; border-radius: 50%; overflow: hidden; background: #111318; box-shadow: 0 0 0 3px #fff, 0 6px 24px rgba(0,0,0,.35); -webkit-app-region: drag; cursor: grab; }
  video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  .msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 18%; color: #fff; font: 600 12px/1.4 Inter, system-ui, sans-serif; }
  .size { position: absolute; right: 10%; bottom: 10%; width: 30px; height: 30px; border-radius: 50%; border: 0; background: rgba(17,19,24,.8); color: #fff; display: grid; place-items: center; cursor: pointer; opacity: 0; transition: opacity .15s; -webkit-app-region: no-drag; }
  body:hover .size { opacity: 1; }
</style>
</head>
<body>
  <div class="ring"><video id="v" autoplay muted playsinline></video><div class="msg" id="msg" hidden></div></div>
  <button class="size" id="size" title="Change size" aria-label="Change size">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
  </button>
  <script type="module" src="bubble.js"></script>
</body>
</html>
