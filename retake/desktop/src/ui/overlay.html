<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Retake overlay</title>
<link rel="stylesheet" href="../../shared/core/tokens.css" />
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { position: fixed; inset: 0; }
  body.drawing #ink { cursor: crosshair; }
  #spot { pointer-events: none; }
  .count { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 180px; height: 180px; border-radius: 50%; background: rgba(17,19,24,.82); color: #fff; display: grid; place-items: center; font: 700 88px Inter, system-ui, sans-serif; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
  .count small { position: absolute; bottom: -44px; left: 50%; transform: translateX(-50%); white-space: nowrap; font: 600 14px Inter, system-ui, sans-serif; color: #fff; background: rgba(17,19,24,.82); padding: 7px 12px; border-radius: 999px; }
  .textin { position: fixed; border: 0; outline: 0; font: 650 16px Inter, system-ui, sans-serif; padding: 8px 11px; border-radius: 9px; min-width: 220px; box-shadow: 0 4px 18px rgba(0,0,0,.25); }
  .textin::placeholder { color: inherit; opacity: .7; }
</style>
</head>
<body>
  <canvas id="spot"></canvas>
  <canvas id="ink"></canvas>
  <div class="count" id="count" hidden></div>
  <script type="module" src="overlay.js"></script>
</body>
</html>
