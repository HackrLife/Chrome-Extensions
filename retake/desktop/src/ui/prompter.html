<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Retake script</title>
<link rel="stylesheet" href="../../shared/core/tokens.css" />
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  .box { position: absolute; inset: 6px; background: rgba(17,19,24,.92); color: #fff; border-radius: 16px; box-shadow: 0 8px 28px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.08); display: flex; flex-direction: column; overflow: hidden; }
  .head { height: 40px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 6px 0 14px; -webkit-app-region: drag; }
  .head .t { font: 600 11px Inter, system-ui, sans-serif; text-transform: uppercase; letter-spacing: .08em; color: rgba(255,255,255,.55); margin-right: auto; display: flex; align-items: center; gap: 8px; }
  .head .t i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.3); display: inline-block; }
  .head .t i.on { background: var(--rec); }
  .head button { -webkit-app-region: no-drag; height: 30px; min-width: 30px; border: 0; background: transparent; color: #fff; border-radius: 8px; display: grid; place-items: center; cursor: pointer; font: 600 12px Inter, system-ui, sans-serif; padding: 0 6px; }
  .head button:hover { background: rgba(255,255,255,.12); }
  .head .val { font: 600 12px Inter, system-ui, sans-serif; color: rgba(255,255,255,.7); min-width: 34px; text-align: center; font-variant-numeric: tabular-nums; }
  .head .sep { width: 1px; height: 18px; background: rgba(255,255,255,.15); margin: 0 4px; }
  .scroll { flex: 1; overflow-y: auto; padding: 0 22px; scrollbar-width: none; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22%, #000 70%, transparent 100%); }
  .scroll::-webkit-scrollbar { display: none; }
  .text { font: 600 28px/1.45 Inter, system-ui, sans-serif; white-space: pre-wrap; padding: 30px 0 70vh; }
  .line { position: absolute; left: 6px; width: 0; height: 0; border-top: 8px solid transparent; border-bottom: 8px solid transparent; border-left: 10px solid var(--rec); transform: translateY(-50%); pointer-events: none; }
</style>
</head>
<body>
  <div class="box">
    <div class="head">
      <span class="t"><i id="live"></i>Script</span>
      <button id="play" title="Pause or start scrolling"></button>
      <button id="top" title="Back to the start"></button>
      <span class="sep"></span>
      <button id="slower" title="Slower">−</button><span class="val" id="speed"></span><button id="faster" title="Faster">+</button>
      <span class="sep"></span>
      <button id="smaller" title="Smaller text">A−</button><button id="bigger" title="Bigger text">A+</button>
    </div>
    <div class="scroll" id="scroll"><div class="text" id="text"></div></div>
  </div>
  <div class="line" id="line"></div>
  <script type="module" src="prompter.js"></script>
</body>
</html>
