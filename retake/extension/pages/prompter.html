<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Retake · Script</title>
<link rel="stylesheet" href="../core/tokens.css" />
<style>
  html, body { height: 100%; margin: 0; }
  body.read { background: #111318; }
  #read { position: fixed; inset: 0; }
  #read .rp { border-radius: 0; }
  #edit { padding: 18px; display: flex; flex-direction: column; gap: 12px; height: 100%; box-sizing: border-box; }
  #edit h1 { font-size: 16px; font-weight: 650; margin: 0; display: flex; align-items: center; gap: 8px; }
  #edit p { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  #text { flex: 1; resize: none; border: 0; border-radius: 12px; background: var(--bg); box-shadow: inset 0 0 0 1px var(--line); padding: 12px; font: 14px/1.5 Inter, system-ui, sans-serif; color: var(--ink); outline: none; }
  #text:focus { box-shadow: inset 0 0 0 2px var(--ink); }
  .bottom { display: flex; align-items: center; gap: 10px; }
  .words { font-size: 12px; color: var(--muted); margin-right: auto; }
  .lbl2 { font-size: 12px; font-weight: 600; color: var(--muted); }
</style>
</head>
<body>
  <div id="edit" hidden>
    <h1 id="title"></h1>
    <p>While you record, the script scrolls in a small window at the top of your screen. It isn’t part of a tab recording. On a window or full-screen recording, keep it outside what you record.</p>
    <textarea id="text" placeholder="Paste or write your script."></textarea>
    <div class="bottom"><span class="lbl2">Speed</span><div class="seg" id="speed"></div><span class="words" id="words"></span><button class="btn rec" id="done" style="height:40px">Done</button></div>
  </div>
  <div id="read" hidden></div>
  <script type="module" src="prompter.js"></script>
</body>
</html>
