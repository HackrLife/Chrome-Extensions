<!-- Supabase › Authentication › Emails › Magic Link. Subject: Your sign-in link -->
<div style="font-family:Inter,Arial,sans-serif;max-width:480px;margin:0 auto;padding:32px 24px;color:#111318">
  <p style="font-size:18px;font-weight:700;margin:0 0 16px">{{ if eq .Data.signup_app "retake" }}Sign in to Retake{{ else }}Sign in to HackrLife{{ end }}</p>
  <p style="font-size:15px;line-height:1.55;margin:0 0 24px">Click the button to sign in. The link works once and expires in an hour.</p>
  <p style="margin:0 0 28px"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#f0464b;color:#ffffff;text-decoration:none;font-weight:600;font-size:15px;padding:13px 22px;border-radius:24px">Sign in</a></p>
  <p style="font-size:13px;line-height:1.5;color:#6b7079;margin:0">If you didn't ask for this, ignore this email and nobody will be signed in.</p>
  <p style="font-size:12px;color:#9aa0aa;margin:28px 0 0">HackrLife · hackrlife.com</p>
</div>
